<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Verified | Developer Intelligence Platform</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 400px;
            max-width: 90%;

            padding: 40px;

            text-align: center;

            background: #0b0f0c;

            border: 1px solid #1f2f25;
            border-radius: 12px;

            box-shadow: 0 0 30px rgba(0, 255, 120, 0.08);
        }

        .icon {
            font-size: 50px;
            color: #32ff7e;

            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #9ca3a8;
            line-height: 1.6;
        }

        .login-btn {
            display: inline-block;

            margin-top: 20px;
            padding: 12px 25px;

            background: #32ff7e;
            color: #050505;

            text-decoration: none;
            font-weight: bold;

            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">✓</div>

        <h1>Email Verified!</h1>

        <p>
            Your email has been successfully verified.
            You can now log in to your account.
        </p>

        <a
            href="{{ url_for('login') }}"
            class="login-btn"
        >
            Go to Login
        </a>

    </div>

</body>

</html>
