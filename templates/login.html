<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Developer Intelligence Platform</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<script>
    history.pushState(null, "", window.location.href);

    window.addEventListener("popstate", function () {
        window.location.replace("{{ url_for('landing') }}");
    });
</script>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>Developer Intelligence Platform</h1>
            <p>Analyze GitHub repositories with AI</p>
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

    <div class="form-group">
        <label for="user_id">Email</label>

        <div class="input-wrapper">
            <span class="input-icon">@</span>

            <input
                type="email"
                id="user_id"
                name="user_id"
                placeholder="you@example.com"
                autocomplete="username"
                required>
        </div>
    </div>


    <div class="form-group">
        <label for="password">Password</label>

        <div class="input-wrapper">
            <span class="input-icon">●</span>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
        </div>
    </div>


    <button type="submit" class="login-btn">
        <span>Login</span>
        <span class="btn-arrow">→</span>
    </button>


    <!-- OAuth Divider -->
    <div class="oauth-divider">
        <span></span>
        <p>OR</p>
        <span></span>
    </div>


    <!-- Google Login -->
    <a href="{{ url_for('google_login') }}" class="google-btn">

        <span class="google-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.96h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.24z"
                    fill="#4285F4"/>
                <path
                    d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.75z"
                    fill="#34A853"/>
                <path
                    d="M6.54 13.86A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.86V7.62H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.38l3.24-2.52z"
                    fill="#FBBC05"/>
                <path
                    d="M12 6.11c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.18 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.37l3.24 2.52C7.31 7.83 9.46 6.11 12 6.11z"
                    fill="#EA4335"/>
            </svg>
        </span>

        <span>Continue with Google</span>

    </a>

</form>

        <div class="register-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

</body>

</html>
