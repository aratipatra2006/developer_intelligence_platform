<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Developer Intelligence Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Developer Intelligence Platform
        </p>

        {% if error %}
<div class="error-popup-overlay" id="errorPopup">
    <div class="error-popup">

        <button class="error-close" onclick="closeErrorPopup()">
            ×
        </button>

        <div class="error-icon">!</div>

        <h2>Registration Failed</h2>

        <p>{{ error }}</p>

        <button class="error-ok-btn" onclick="closeErrorPopup()">
            OK
        </button>

    </div>
</div>
{% endif %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

<script>
function closeErrorPopup() {
    const popup = document.getElementById("errorPopup");

    if (popup) {
        popup.remove();
    }
}
</script>
</body>

</html>
